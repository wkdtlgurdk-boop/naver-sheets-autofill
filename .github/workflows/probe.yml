name: probe-naver

# 일회용 진단. 네이버 응답에 무엇이 들어 있는지 러너가 찔러보고 로그로 남긴다.
# 개발 세션에서는 네이버에 직접 붙을 수 없어서 필요한 우회로다.
#
# 지금 묻는 것: 수급 API(trendForeignOrg)가 순매수 상위 20종목 말고 시장 전체
# 순매수액도 주는가. 준다면 부호가 있으므로 아침 알림에 '3일 매도 후 매수 전환'
# 을 쓸 수 있고, 안 주면 다른 출처를 찾아야 한다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python probe_naver.py
