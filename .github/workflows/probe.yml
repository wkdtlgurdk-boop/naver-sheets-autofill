name: probe-naver

# 일회용 (2026-10-04): 유튜브 쇼츠 영상 확인. test_cards·test_shorts 를 러너에서 돌리고,
# 10/2 실제 스캔 결과로 카드와 쇼츠 mp4 를 만들어 preview/ 에 올린다. 확인 후 되돌린다.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra ffmpeg
      - run: python test_cards.py
      - run: python test_shorts.py
      - uses: actions/download-artifact@v4
        with:
          name: scan-37001435269
          run-id: 37001435269
          github-token: ${{ github.token }}
          path: scan1002
      - name: Render 10/2 cards and shorts
        env:
          THEME_AS_OF: "2026-10-02"
          SHORTS_DEBUG_FRAMES: "1.2,3.0,4.2,5.0,8.0,27.5"
        run: |
          cp scan1002/final_groups.json scan1002/market_summary.json .
          python cards.py preview
          python shorts.py preview preview/shorts_20261002.mp4
          ls -la preview preview/20261002
          ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of default=nw=1 preview/shorts_20261002.mp4
      - name: Push preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f preview
          git commit -m "임시: 10/2 쇼츠 미리보기 (확인 후 삭제)"
          git push origin HEAD:${{ github.ref_name }}
