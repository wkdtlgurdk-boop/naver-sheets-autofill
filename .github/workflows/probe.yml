name: probe-naver

# 일회용 진단. 네이버 응답에 무엇이 들어 있는지 러너가 찔러보고 로그로 남긴다.
# 개발 세션에서는 네이버에 직접 붙을 수 없어서 필요한 우회로다.
#
# 지금 묻는 것: (1) 지수 경로가 아직 살아 있는가, (2) 휴장일 달력을 무엇으로
# 채울 것인가 -- 실제 거래일과 공휴일 API 를 맞춰 본다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python probe_naver.py
      - run: python probe_holidays.py
