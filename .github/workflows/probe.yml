name: probe-naver

# 일회용 (2026-10-04): 긴 테마 이름 카드 수정 확인. test_cards 를 러너에서 돌리고,
# 10/2 실제 스캔 결과로 카드를 다시 그려 preview/ 에 올린다. 확인 후 원래대로 되돌린다.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra
      - run: python test_cards.py
      - uses: actions/download-artifact@v4
        with:
          name: scan-37001435269
          run-id: 37001435269
          github-token: ${{ github.token }}
          path: scan1002
      - name: Render 10/2 cards with the fix
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          import cards
          g = json.load(open("scan1002/final_groups.json", encoding="utf-8"))
          m = json.load(open("scan1002/market_summary.json", encoding="utf-8"))
          for p in cards.build(Path("preview"), g, m, datetime(2026, 10, 2, 17, 0)):
              print(p)
          PY
      - name: Push preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          git commit -m "임시: 10/2 카드 다시 그린 미리보기 (확인 후 삭제)"
          git push origin HEAD:${{ github.ref_name }}
