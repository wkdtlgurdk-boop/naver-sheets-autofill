name: supply-demand-autofill

on:
  schedule:
    # 20:20, 21:10, 22:10 KST on weekdays (11:20 / 12:10 / 13:10 UTC).
    #
    # 20:10 was tuned on 2026-09-07, when the figures were estimated at 18:00
    # and settled by 20:05. KRX then extended trading to 20:00 and that
    # premise died: 2026-09-14 still returned estimated=true for 외인/KOSPI at
    # 20:20, so the run skipped and the day never got written.
    #
    # Where settlement now lands is unmeasured, so rather than name the
    # minute, try three times and let the earliest one that works win.
    # 20:20 is the optimistic attempt -- it is the hour that failed on 9/14,
    # so expect it to skip often, but on a day it lands the sheet is filled
    # an hour and a half sooner. Writing is idempotent (the day's slot is
    # found by its date label and overwritten with identical values), so the
    # later passes cost nothing once one has succeeded.
    #
    # Once a few weeks of logs show which hour actually settles, cut this
    # back to that one plus a single backstop.
    - cron: "20 11 * * 1-5"
    - cron: "10 12 * * 1-5"
    - cron: "10 13 * * 1-5"
  workflow_dispatch:
    inputs:
      # 네이버에는 일별 과거 조회가 없다. 놓친 하루는 사람이 HTS 에서 보고
      # 적은 파일을 저장소에 커밋한 뒤 그 경로를 여기 넣어 채운다. 파일을
      # 커밋해 두는 것은 손으로 넣은 숫자가 어디서 왔는지 남기기 위해서다.
      backfill_file:
        description: "손으로 적은 하루치 파일 경로 (비우면 오늘치를 API 에서)"
        type: string
        default: ""
      day:
        description: "backfill_file 이 채울 날짜 (YYYY-MM-DD)"
        type: string
        default: ""
      dry_run:
        description: "시트를 건드리지 않고 계획만"
        type: boolean
        default: false

concurrency:
  group: supply-demand
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run logic tests
        run: |
          python test_supply_demand.py
          python test_feed_export.py

      # Writes nothing unless all four blocks (외인/기관 x 코스피/코스닥) come
      # back final. A holiday or a mid-session run exits 0 without touching the
      # sheet, so a red run here means something is actually broken.
      - name: Write supply-demand sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # 그날의 마지막 예약 실행에서만 켠다. 거기서도 아직 확정 전이면
          # 그 하루가 빠지는 것이므로 초록불로 넘기지 않고 빨갛게 남긴다.
          # (휴장일은 해당 없음 -- 그때는 오늘 자료 자체가 없어 조용히 끝난다.)
          SD_STRICT: ${{ github.event.schedule == '10 13 * * 1-5' && '1' || '' }}
          # 셸 인용 사고를 막으려고 환경변수로 건넨다.
          BACKFILL_FILE: ${{ inputs.backfill_file }}
          BACKFILL_DAY: ${{ inputs.day }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$BACKFILL_FILE" ]; then
            args+=(--backfill "$BACKFILL_FILE" --day "$BACKFILL_DAY")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          # --export 는 방금 시트에 쓴 것을 종목코드까지 붙여 파일로 남긴다.
          # 건너뛴 날(휴장·확정 전)과 손으로 채운 날에는 파일이 안 생기고,
          # 다음 단계가 그것을 보고 조용히 넘어간다.
          python supply_demand.py "${args[@]}" --export supply_today.json

      # 아침 매수 후보 봇(volume-surge-telegram-bot/tradesignal)의 수급 신호는
      # '최근 5거래일 중 3일 순매수 상위'다. 순위 API 는 하루치 스냅샷만 주므로
      # 예전에는 봇이 캐시에 직접 이력을 쌓았는데, 그 창은 이미 이 시트가 들고
      # 있다 -- 같은 5일을 두 군데서 세지 않도록 시트 쪽을 공개 저장소로 내보내
      # 봇이 그것을 읽게 한다. 카드가 theme_bot 으로 나가는 길과 같다.
      #
      # 하루 세 번 도는 크론 중 처음 성공한 실행이 피드를 만들고, 뒤따르는
      # 실행은 같은 내용을 다시 써서 커밋할 것이 없다.
      - name: Publish supply feed to theme_bot
        if: success()
        env:
          CARD_REPO_TOKEN: ${{ secrets.CARD_REPO_TOKEN || secrets.CARDREPOTOKEN }}
        run: |
          if [ ! -f supply_today.json ]; then
            echo "내보낼 것이 없습니다 (휴장·확정 전·손으로 채운 날) — 피드를 그대로 둡니다."
            exit 0
          fi
          if [ -z "$CARD_REPO_TOKEN" ]; then
            echo "CARD_REPO_TOKEN 이 없어 수급 피드를 올리지 않습니다."
            echo "봇은 수급 신호를 끈 채로 돌고, 알림에 그렇게 적습니다."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${CARD_REPO_TOKEN}@github.com/wkdtlgurdk-boop/theme_bot.git" /tmp/theme_bot
          # 내보낼 것이 없어 파일이 안 생겨도 git add 가 죽지 않게 자리는 만든다
          mkdir -p /tmp/theme_bot/feed
          python feed_export.py supply --today supply_today.json --feed-dir /tmp/theme_bot/feed
          cd /tmp/theme_bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feed
          git diff --cached --quiet && echo "no feed change" && exit 0
          git commit -m "supply feed $(TZ=Asia/Seoul date +%Y%m%d)"
          git push origin HEAD:main
