name: supply-demand-autofill

on:
  schedule:
    # 20:10 KST on weekdays (11:10 UTC). The foreign/institution figures are
    # still marked estimated at 18:00 (measured 2026-09-07) and settled by
    # 20:05, so this is the earliest hour known to be safe -- not a habit.
    # Scheduled runs on this repo start 5-13 minutes late, which is fine here.
    - cron: "10 11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: supply-demand
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run logic tests
        run: python test_feed_export.py

      # Writes nothing unless all four blocks (외인/기관 x 코스피/코스닥) come
      # back final. A holiday or a mid-session run exits 0 without touching the
      # sheet, so a red run here means something is actually broken.
      # --export 는 방금 시트에 쓴 것을 종목코드까지 붙여 파일로 남긴다. 휴장
      # 이거나 확정 전이면 시트를 안 쓰므로 파일도 안 생기고, 다음 단계가 그것을
      # 보고 조용히 넘어간다.
      - name: Write supply-demand sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python supply_demand.py --export supply_today.json

      # 아침 매수 후보 봇(volume-surge-telegram-bot/tradesignal)의 수급 신호는
      # '최근 5거래일 중 3일 순매수 상위'다. 순위 API 는 하루치 스냅샷만 주므로
      # 예전에는 봇이 캐시에 직접 이력을 쌓았는데, 그 창은 이미 이 시트가 들고
      # 있다 -- 같은 5일을 두 군데서 세지 않도록 시트 쪽을 공개 저장소로 내보내
      # 봇이 그것을 읽게 한다. 카드가 theme_bot 으로 나가는 길과 같다.
      - name: Publish supply feed to theme_bot
        if: success()
        env:
          CARD_REPO_TOKEN: ${{ secrets.CARD_REPO_TOKEN || secrets.CARDREPOTOKEN }}
        run: |
          if [ ! -f supply_today.json ]; then
            echo "내보낼 것이 없습니다 (휴장이거나 확정 전) — 피드를 그대로 둡니다."
            exit 0
          fi
          if [ -z "$CARD_REPO_TOKEN" ]; then
            echo "CARD_REPO_TOKEN 이 없어 수급 피드를 올리지 않습니다."
            echo "봇은 수급 신호를 끈 채로 돌고, 알림에 그렇게 적습니다."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${CARD_REPO_TOKEN}@github.com/wkdtlgurdk-boop/theme_bot.git" /tmp/theme_bot
          # 내보낼 것이 없어 파일이 안 생겨도 git add 가 죽지 않게 자리는 만든다
          mkdir -p /tmp/theme_bot/feed
          python feed_export.py supply --today supply_today.json --feed-dir /tmp/theme_bot/feed
          cd /tmp/theme_bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feed
          git diff --cached --quiet && echo "no feed change" && exit 0
          git commit -m "supply feed $(TZ=Asia/Seoul date +%Y%m%d)"
          git push origin HEAD:main
