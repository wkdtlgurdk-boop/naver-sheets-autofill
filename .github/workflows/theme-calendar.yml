name: theme-calendar-autofill

on:
  schedule:
    # 17:10 KST on weekdays (08:10 UTC). Moved up from 20:13: the figures this
    # job reads settle right after the 15:30 close (measured 2026-09-07 — the
    # index page's foreign-net number moved 340bn won at 15:31-15:33 and then
    # 0.8bn over the next hour), so there is nothing to gain by waiting until
    # evening. The Threads bot that reads this sheet runs at 21:00, which
    # leaves the write plenty of room even at the worst delay seen here.
    #
    # Still off the top of the hour: scheduled runs on this repo have started
    # 8-13 minutes late, so expect roughly 17:18-17:23.
    - cron: "10 8 * * 1-5"
  workflow_dispatch:

concurrency:
  group: theme-calendar
  cancel-in-progress: false

# The run commits the day's keywords.json back so the grouping stays visible
# and editable in the repo rather than only in a log.
permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Scan finance.naver.com's theme pages and merge overlapping themes.
      # Roughly 40 page fetches, ~10s. Writes final_groups.json.
      - name: Scan themes
        run: python theme_scan.py

      # Ask Claude to group the day's themes and rewrite keywords.json. The
      # mechanical merge only sees which stocks moved today, so it splits
      # themes that are plainly the same industry and labels big groups with
      # whichever member name is shortest. This step exits 0 without touching
      # keywords.json when the key is missing or the call fails, so a bad day
      # here degrades to yesterday's keywords rather than skipping the write.
      - name: Group themes with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python llm_group.py

      # Re-derive the groups under the new keywords, reusing the scan on disk.
      - name: Regroup
        run: python theme_scan.py --regroup

      - name: Fetch index summary
        run: python market_summary.py > market_summary.json

      - name: Show what was found
        run: |
          python - <<'PY'
          import json
          groups = json.load(open("final_groups.json", encoding="utf-8"))
          print(f"{len(groups)} groups")
          for g in groups:
              top = g["top5"][0] if g["top5"] else None
              head = f"{top['name']} {top['rate']:+.2f}%" if top else "(none)"
              print(f"  [{g['keyword']}] {len(g['top5'])} stocks, top: {head}")
          PY

      - name: Write both calendars
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python theme_write.py

      # Keep the day's grouping in the repo so it can be read and corrected.
      # An edit here steers the next run: theme_scan reads keywords.json on
      # every pass, and llm_group only rewrites it when its own answer passes
      # validation. Runs after the write so a failed write never lands a
      # grouping that was never used.
      - name: Commit keywords.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keywords.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Group today's themes ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      # The scan output is the audit trail for what was written. Keep it
      # even when the write step fails — that is exactly when it is wanted.
      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: |
            raw_scan.json
            final_groups.json
            final_groups.txt
            market_summary.json
          if-no-files-found: warn
          retention-days: 14
