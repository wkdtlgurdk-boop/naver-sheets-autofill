name: theme-calendar-autofill

on:
  schedule:
    # Lands at 16:00 KST on weekdays. The figures this job reads settle right
    # after the 15:30 close (measured 2026-09-07 — the index page's foreign-net
    # number moved 340bn won at 15:31-15:33 and then 0.8bn over the next hour),
    # so 16:00 is early enough to be safe and leaves the card bot room.
    #
    # 06:55 UTC, not 07:00, and the difference is the point. Scheduled runs on
    # this repo start 5-13 minutes late (measured 2026-09-07: 5:08 and 12:45),
    # so :55 arrives around 16:00-16:08 KST. Asking for 07:00 would not arrive
    # at 16:00 — it would arrive later, and the top of the hour is where the
    # worst delays on record sit (a sibling repo's "0 8" runs came in 113-141
    # minutes late and skipped a day outright). Never move this to :00.
    #
    # The card bot fires at 16:40 local and publishes at 17:00, so even the
    # slowest run seen here still lands the sheet with half an hour to spare.
    - cron: "55 6 * * 1-5"
  workflow_dispatch:
    inputs:
      skip_sheet:
        description: "시트에 쓰지 않고 카드/게시만 (오늘 블록이 이미 찬 날 시험용)"
        type: boolean
        default: false
      as_of:
        description: "지난 날짜를 다시 채울 때 (YYYY-MM-DD). 비우면 오늘"
        type: string
        default: ""
      repost:
        description: "as_of 로 지난 날짜를 다시 만들 때도 스레드에 올린다 (같은 날 글이 둘이 될 수 있음)"
        type: boolean
        default: false
      clear_first:
        description: "그 날 블록을 비우고 다시 쓴다 (as_of 와 함께만)"
        type: boolean
        default: false
      skip_threads:
        description: "카드만 만들고 스레드에는 올리지 않음 (내용 확인용)"
        type: boolean
        default: false

concurrency:
  group: theme-calendar
  cancel-in-progress: false

# The run commits the day's keywords.json back so the grouping stays visible
# and editable in the repo rather than only in a log.
permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # The grouping and exclusion rules fail quietly when they fail -- a theme
      # that was filtered out looks the same as a theme that did not move. 20
      # seconds here beats reading it off the sheet a day later.
      - name: Run logic tests
        run: |
          python test_theme_scan.py
          python test_llm_group.py
          python test_theme_write.py
          python test_groups_from_sheet.py
          python test_feed_export.py

      # Scan finance.naver.com's theme pages and merge overlapping themes.
      # The list is ordered by today's move, so only its first SCAN_PAGES pages
      # are read -- ~80 themes and ~82 fetches, down from 266 and ~270 (67s
      # measured). Writes final_groups.json.
      - name: Scan themes
        run: python theme_scan.py

      # Ask Claude to group the day's themes and rewrite keywords.json. The
      # mechanical merge only sees which stocks moved today, so it splits
      # themes that are plainly the same industry and labels big groups with
      # whichever member name is shortest. This step exits 0 without touching
      # keywords.json when the key is missing or the call fails, so a bad day
      # here degrades to yesterday's keywords rather than skipping the write.
      # 구독으로 부른다. 토큰당 과금되는 API 키 대신 Claude Code CLI 가
      # CLAUDE_CODE_OAUTH_TOKEN 을 읽는다 (`claude setup-token` 으로 만드는
      # 1년짜리 토큰). industry-report-telegram-bot 이 같은 이유로 먼저
      # 옮겨 갔고 그쪽 워크플로와 같은 모양이다.
      - run: npm install -g @anthropic-ai/claude-code

      - name: Group themes with Claude
        env:
          # ANTHROPIC_API_KEY 를 넘기지 않는다. 인증 우선순위상 그쪽이
          # CLAUDE_CODE_OAUTH_TOKEN 을 이겨서, 구독으로 돌리려던 호출이
          # 조용히 과금된다.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python llm_group.py

      # Re-derive the groups under the new keywords, reusing the scan on disk.
      - name: Regroup
        run: python theme_scan.py --regroup

      # 시트에는 종목코드가 없다. 아침 매수 후보 봇은 일봉을 받아야 하므로
      # 코드가 있어야 하고, 코드를 아는 것은 스캔뿐이다 -- 오늘 본 이름->코드를
      # codes.json 에 쌓아 두면 스캔이 0개인 날(시트에서 복원한 날)에도 어제까지
      # 쌓인 지도로 코드가 붙는다. 지우지 않고 덧붙이기만 한다.
      - name: Remember today's stock codes
        if: always()
        run: python feed_export.py codes

      # 임시 파일에 받아서 성공했을 때만 옮긴다. 바로 리다이렉트하면 스크립트가
      # 죽어도 0바이트 파일이 남아, 뒤 단계가 "파일은 있는데 JSON 이 아니다" 라는
      # 엉뚱한 오류로 죽는다.
      - name: Fetch index summary
        run: |
          python market_summary.py > /tmp/market_summary.json
          mv /tmp/market_summary.json market_summary.json

      - name: Show what was found
        run: |
          python - <<'PY'
          import json
          groups = json.load(open("final_groups.json", encoding="utf-8"))
          print(f"{len(groups)} groups")
          for g in groups:
              top = g["top5"][0] if g["top5"] else None
              head = f"{top['name']} {top['rate']:+.2f}%" if top else "(none)"
              # source_themes 도 찍는다. 그룹 이름이 엉뚱할 때 어느 네이버
              # 테마가 그 이름을 끌고 왔는지는 이것 없이는 알 수 없다 --
              # 2026-09-16 광통신 종목들이 '반도체·IT 대표주'로 나간 건이
              # 그랬다.
              print(f"  [{g['keyword']}] {len(g['top5'])} stocks, top: {head}")
              print(f"      <- {', '.join(g.get('source_themes') or [])}")
          PY

      # 시트는 하루 한 번만 써야 한다. 오늘 블록이 이미 절반 찬 상태에서 다시
      # 돌리면 저녁 그룹이 남은 빈 슬롯을 채워, 한 날짜 블록에 오후와 저녁 두
      # 스냅샷이 섞인다. 카드 경로만 시험하고 싶을 때 이 단계를 건너뛴다.
      # (예약 실행에는 inputs 가 없으므로 조건이 참이 되어 정상적으로 쓴다.)
      - name: Write both calendars
        if: ${{ inputs.skip_sheet != true }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # 지난 날짜를 다시 채울 때만 쓴다. clear_first 는 as_of 없이는
          # theme_write 가 거부하므로, 오늘 블록이 실수로 지워지지 않는다.
          THEME_AS_OF: ${{ inputs.as_of }}
          THEME_CLEAR_FIRST: ${{ inputs.clear_first && '1' || '' }}
        run: python theme_write.py

      # Cards for Threads. Rendered from final_groups.json, so they say the
      # same numbers as the sheet without reading it -- a card still goes out
      # on a day the sheet write fails. The font package carries the Black and
      # Medium weights the layout uses; without -extra it falls back to Bold
      # and the lines get heavier, which the layout test would catch.
      # 스캔이 죽어도 카드는 만들 수 있다. 테마 분석 결과는 이미 시트에 있고,
      # 카드가 쓰는 것(종목명·상승률·거래대금)이 거기 그대로 있기 때문이다.
      # 네이버가 /sise/* 를 클라이언트 렌더로 바꾼 뒤로 스캔이 0개로 멈추는데,
      # 그때 하루치 카드와 게시가 통째로 날아가는 것을 막는다. 스캔이 살아 있으면
      # 이 단계는 아무것도 하지 않는다.
      - name: 스캔이 비면 시트에서 그룹 복원
        if: ${{ !cancelled() }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          THEME_AS_OF: ${{ inputs.as_of }}
        run: |
          # 파일이 있는지가 아니라 그룹이 있는지를 본다. 스캔이 0개로
          # 끝나도 final_groups.json 은 "[]" 라는 2바이트 파일로 남으므로
          # -s 로 보면 '결과가 있다'가 되어 정작 필요한 순간에 복원이 안
          # 걸린다. 9/14 실행이 그랬다 -- 0개를 받고도 시트를 읽지 않았다.
          n=$(python -c 'import json;print(len(json.load(open("final_groups.json",encoding="utf-8"))))' 2>/dev/null || echo 0)
          # 지난 날짜를 다시 만드는 실행은 스캔 결과를 쓰지 않는다. 스캔은
          # 언제 돌든 '지금 시세'를 읽으므로 지난 거래일을 재현할 수 없다.
          # 장중에 9/11 을 되살리면 월요일 장중 데이터가 9/11 이라는 날짜를
          # 달고 나간다 -- 고치려던 것과 똑같은 사고다. 그 날 자료는 시트에
          # 있고, 시트가 유일한 출처다.
          if [ -n "$THEME_AS_OF" ]; then
            echo "THEME_AS_OF=$THEME_AS_OF — 스캔($n 개)을 버리고 시트에서 읽습니다."
            python groups_from_sheet.py
          elif [ "$n" -gt 0 ]; then
            echo "스캔이 $n 개를 찾았습니다 — 시트를 읽지 않습니다."
          else
            echo "스캔이 0개입니다 — Daily 시트에서 해당 날짜 블록을 읽습니다."
            python groups_from_sheet.py
          fi

      - name: Install Korean fonts
        if: ${{ !cancelled() }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

      - name: Check card layout
        if: ${{ !cancelled() }}
        run: python test_cards.py

      - name: Render cards
        if: ${{ !cancelled() }}
        env:
          THEME_AS_OF: ${{ inputs.as_of }}
        run: python cards.py

      # Threads fetches images by URL rather than accepting an upload, so the
      # cards have to sit somewhere public before the post is made. That is
      # what theme_bot is -- a public image host. Pushing there needs a token
      # of its own; this repo's GITHUB_TOKEN cannot reach another repo.
      - name: Publish cards to theme_bot
        if: ${{ !cancelled() }}
        env:
          # 밑줄 없는 이름으로 먼저 등록돼 있어서 둘 다 받는다. 시크릿은
          # 이름을 고칠 수 없고 값을 다시 붙여넣는 것도 번거로우므로, 맞는
          # 이름이 있으면 그것을, 없으면 처음 쓰던 이름을 쓴다.
          CARD_REPO_TOKEN: ${{ secrets.CARD_REPO_TOKEN || secrets.CARDREPOTOKEN }}
          # 피드는 시트를 되읽어 만든다 -- final_groups.json 이 아니라 시트가
          # 기준이어야, 사람이 블록을 손으로 고친 것까지 봇에 그대로 간다.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          THEME_AS_OF: ${{ inputs.as_of }}
        run: |
          if [ -z "$CARD_REPO_TOKEN" ]; then
            echo "CARD_REPO_TOKEN 이 없어 카드를 공개 리포에 올리지 않습니다."
            echo "카드는 이 실행의 아티팩트에 남아 있습니다."
            exit 0
          fi
          # 카드 폴더 이름은 '오늘'이 아니라 이 글이 다루는 거래일이다.
          # cards.py 가 THEME_AS_OF 로 폴더를 만들었으므로 여기도 같이 따라가야
          # 한다 -- 안 그러면 있지도 않은 폴더를 찾아 cp 가 죽는다.
          day=$(TZ=Asia/Seoul date -d "${THEME_AS_OF:-today}" +%Y%m%d)
          git clone --depth 1 \
            "https://x-access-token:${CARD_REPO_TOKEN}@github.com/wkdtlgurdk-boop/theme_bot.git" /tmp/theme_bot
          mkdir -p /tmp/theme_bot/cards /tmp/theme_bot/feed
          # 그 날 폴더를 통째로 갈아 끼운다. cp 만 하면 지난 실행이 남긴
          # 카드가 섞인다 -- 테마 이름이 파일명이라 그룹이 바뀌면 이름도
          # 바뀌고, 없어진 테마의 카드가 그대로 남는다.
          rm -rf "/tmp/theme_bot/cards/$day"
          cp -r "cards/$day" /tmp/theme_bot/cards/
          # 카드와 같은 클론에 시트 피드도 얹는다. 아침 매수 후보 봇은 구글
          # 인증이 없어 시트를 직접 못 읽으므로, 방금 쓴 시트 블록을 여기로
          # 내보내 raw.githubusercontent.com 으로 받아 가게 한다. 실패해도
          # 카드 게시는 막지 않는다 -- 피드가 하루 낡으면 봇이 스스로 신호를
          # 끄고 그렇게 알린다.
          python feed_export.py themes --feed-dir /tmp/theme_bot/feed \
            || echo "[주의] 테마 피드를 내보내지 못했습니다 — 봇은 어제 피드를 낡았다고 보고 신호를 끕니다"
          cd /tmp/theme_bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cards feed   # -A: 갈아 끼우며 지워진 카드도 반영
          git diff --cached --quiet && echo "no new cards or feed" && exit 0
          git commit -m "cards $day"
          git push origin HEAD:main

      # Exits 0 without posting when the token is missing or expired. The
      # Threads long-lived token lasts 60 days; a lapsed one should not turn
      # the day's sheet run red when the cards are already published.
      - name: Post to Threads
        if: ${{ !cancelled() && inputs.skip_threads != true }}
        env:
          # 위 CARD_REPO_TOKEN 과 같은 이유로 두 이름을 모두 받는다.
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID || secrets.THREADUSERID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN || secrets.THREADACCESSTOKEN }}
          THEME_AS_OF: ${{ inputs.as_of }}
          THREADS_ALLOW_BACKFILL: ${{ inputs.repost && '1' || '' }}
        run: python post_threads.py

      # Keep the day's grouping and exclusions in the repo so they can be read
      # and corrected. An edit steers the next run: theme_scan reads both files
      # on every pass, llm_group only rewrites keywords.json when its own answer
      # passes validation, and it only ever appends to exclusions.json -- a line
      # a person wrote or deleted there stays that way. Runs after the write so
      # a failed write never lands a grouping that was never used.
      - name: Commit keywords.json, exclusions.json and codes.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keywords.json exclusions.json codes.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Group today's themes ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      # The scan output is the audit trail for what was written. Keep it
      # even when the write step fails — that is exactly when it is wanted.
      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: |
            raw_scan.json
            final_groups.json
            final_groups.txt
            market_summary.json
            cards/**
          if-no-files-found: warn
          retention-days: 14
