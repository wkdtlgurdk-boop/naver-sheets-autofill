name: theme-calendar-autofill

on:
  schedule:
    # Lands at 16:00 KST on weekdays. The figures this job reads settle right
    # after the 15:30 close (measured 2026-09-07 — the index page's foreign-net
    # number moved 340bn won at 15:31-15:33 and then 0.8bn over the next hour),
    # so 16:00 is early enough to be safe and leaves the card bot room.
    #
    # 06:55 UTC, not 07:00, and the difference is the point. Scheduled runs on
    # this repo start 5-13 minutes late (measured 2026-09-07: 5:08 and 12:45),
    # so :55 arrives around 16:00-16:08 KST. Asking for 07:00 would not arrive
    # at 16:00 — it would arrive later, and the top of the hour is where the
    # worst delays on record sit (a sibling repo's "0 8" runs came in 113-141
    # minutes late and skipped a day outright). Never move this to :00.
    #
    # The card bot fires at 16:40 local and publishes at 17:00, so even the
    # slowest run seen here still lands the sheet with half an hour to spare.
    - cron: "55 6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: theme-calendar
  cancel-in-progress: false

# The run commits the day's keywords.json back so the grouping stays visible
# and editable in the repo rather than only in a log.
permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # The grouping and exclusion rules fail quietly when they fail -- a theme
      # that was filtered out looks the same as a theme that did not move. 20
      # seconds here beats reading it off the sheet a day later.
      - name: Run logic tests
        run: |
          python test_theme_scan.py
          python test_llm_group.py
          python test_theme_write.py

      # Scan finance.naver.com's theme pages and merge overlapping themes.
      # The list is ordered by today's move, so only its first SCAN_PAGES pages
      # are read -- ~80 themes and ~82 fetches, down from 266 and ~270 (67s
      # measured). Writes final_groups.json.
      - name: Scan themes
        run: python theme_scan.py

      # Ask Claude to group the day's themes and rewrite keywords.json. The
      # mechanical merge only sees which stocks moved today, so it splits
      # themes that are plainly the same industry and labels big groups with
      # whichever member name is shortest. This step exits 0 without touching
      # keywords.json when the key is missing or the call fails, so a bad day
      # here degrades to yesterday's keywords rather than skipping the write.
      - name: Group themes with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python llm_group.py

      # Re-derive the groups under the new keywords, reusing the scan on disk.
      - name: Regroup
        run: python theme_scan.py --regroup

      - name: Fetch index summary
        run: python market_summary.py > market_summary.json

      - name: Show what was found
        run: |
          python - <<'PY'
          import json
          groups = json.load(open("final_groups.json", encoding="utf-8"))
          print(f"{len(groups)} groups")
          for g in groups:
              top = g["top5"][0] if g["top5"] else None
              head = f"{top['name']} {top['rate']:+.2f}%" if top else "(none)"
              print(f"  [{g['keyword']}] {len(g['top5'])} stocks, top: {head}")
          PY

      - name: Write both calendars
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python theme_write.py

      # Cards for Threads. Rendered from final_groups.json, so they say the
      # same numbers as the sheet without reading it -- a card still goes out
      # on a day the sheet write fails. The font package carries the Black and
      # Medium weights the layout uses; without -extra it falls back to Bold
      # and the lines get heavier, which the layout test would catch.
      - name: Install Korean fonts
        if: ${{ !cancelled() }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

      - name: Check card layout
        if: ${{ !cancelled() }}
        run: python test_cards.py

      - name: Render cards
        if: ${{ !cancelled() }}
        run: python cards.py

      # Threads fetches images by URL rather than accepting an upload, so the
      # cards have to sit somewhere public before the post is made. That is
      # what theme_bot is -- a public image host. Pushing there needs a token
      # of its own; this repo's GITHUB_TOKEN cannot reach another repo.
      - name: Publish cards to theme_bot
        if: ${{ !cancelled() }}
        env:
          CARD_REPO_TOKEN: ${{ secrets.CARD_REPO_TOKEN }}
        run: |
          if [ -z "$CARD_REPO_TOKEN" ]; then
            echo "CARD_REPO_TOKEN 이 없어 카드를 공개 리포에 올리지 않습니다."
            echo "카드는 이 실행의 아티팩트에 남아 있습니다."
            exit 0
          fi
          day=$(TZ=Asia/Seoul date +%Y%m%d)
          git clone --depth 1 \
            "https://x-access-token:${CARD_REPO_TOKEN}@github.com/wkdtlgurdk-boop/theme_bot.git" /tmp/theme_bot
          mkdir -p /tmp/theme_bot/cards
          cp -r "cards/$day" /tmp/theme_bot/cards/
          cd /tmp/theme_bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git diff --cached --quiet && echo "no new cards" && exit 0
          git commit -m "cards $day"
          git push origin HEAD:main

      # Exits 0 without posting when the token is missing or expired. The
      # Threads long-lived token lasts 60 days; a lapsed one should not turn
      # the day's sheet run red when the cards are already published.
      - name: Post to Threads
        if: ${{ !cancelled() }}
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post_threads.py

      # Keep the day's grouping and exclusions in the repo so they can be read
      # and corrected. An edit steers the next run: theme_scan reads both files
      # on every pass, llm_group only rewrites keywords.json when its own answer
      # passes validation, and it only ever appends to exclusions.json -- a line
      # a person wrote or deleted there stays that way. Runs after the write so
      # a failed write never lands a grouping that was never used.
      - name: Commit keywords.json and exclusions.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keywords.json exclusions.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Group today's themes ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      # The scan output is the audit trail for what was written. Keep it
      # even when the write step fails — that is exactly when it is wanted.
      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: |
            raw_scan.json
            final_groups.json
            final_groups.txt
            market_summary.json
            cards/**
          if-no-files-found: warn
          retention-days: 14
