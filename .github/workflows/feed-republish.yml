name: feed-republish

# 시트에 이미 적혀 있는 날의 테마 피드만 다시 내보낸다. 손으로만 돈다.
#
# 왜 theme-calendar.yml 을 다시 돌리지 않는가: 그쪽은 스캔부터 카드 렌더까지
# 다 하고 theme_bot 의 그날 카드 폴더를 통째로 갈아 끼운다. 스레드에 이미
# 올라간 글이 그 이미지 URL 을 가리키고 있으므로, 피드 하나 만들자고 카드를
# 다시 그리게 둘 수 없다.
#
# 쓰는 때:
#   - 피드 내보내기를 붙이기 전에 돈 날을 메울 때 (처음 한 번)
#   - 사람이 시트 블록을 손으로 고친 뒤 봇에 반영하고 싶을 때
#   - 내보내기가 실패한 날을 다시 밀어 넣을 때
#
# 시트를 읽기만 한다. 시트에 쓰지 않는다.

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "어느 날 블록을 내보낼지 (YYYY-MM-DD). 비우면 오늘"
        type: string
        default: ""
      dry_run:
        description: "읽어서 보여주기만 하고 올리지 않음"
        type: boolean
        default: false
      skip_codes:
        description: "이름→코드 지도 갱신을 건너뛴다 (지도가 이미 충분할 때)"
        type: boolean
        default: false

concurrency:
  group: feed-republish
  cancel-in-progress: false

# 갱신한 이름->코드 지도를 저장소에 되돌려 놓는다.
permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run logic tests
        run: python test_feed_export.py

      # 시트에는 종목코드가 없고, 지도는 매일의 스캔이 채운다. 그런데 이
      # 워크플로가 메우려는 날은 대개 그 스캔이 없던 날이다 -- 2026-09-15 에
      # 처음 돌렸을 때 시트의 27종목이 전부 코드 없이 나갔고, 봇 입장에서는
      # 그 피드가 빈 것과 같다.
      #
      # 그래서 여기서는 네이버 구성종목을 통째로 훑어 지도부터 채운다. 매일
      # 도는 길에서는 스캔이 이미 들고 있는 것을 쓰므로 이 비용이 없다.
      - name: Refresh the name-to-code map
        if: ${{ inputs.skip_codes != true }}
        run: python feed_export.py codes --from-naver

      - name: Commit the code map
        if: ${{ inputs.skip_codes != true && inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codes.json
          git diff --cached --quiet && echo "지도에 바뀐 것이 없습니다" && exit 0
          git commit -m "Refresh the stock code map"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Republish theme feed
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CARD_REPO_TOKEN: ${{ secrets.CARD_REPO_TOKEN || secrets.CARDREPOTOKEN }}
          THEME_AS_OF: ${{ inputs.as_of }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python feed_export.py themes --dry-run --feed-dir /tmp/unused
            exit 0
          fi
          if [ -z "$CARD_REPO_TOKEN" ]; then
            echo "CARD_REPO_TOKEN 이 없어 피드를 올릴 수 없습니다."
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${CARD_REPO_TOKEN}@github.com/wkdtlgurdk-boop/theme_bot.git" /tmp/theme_bot
          mkdir -p /tmp/theme_bot/feed
          # 시트에서 그 날 블록을 못 읽으면 여기서 0 이 아닌 값으로 죽는다.
          # 빈 피드를 올리면 봇은 '오늘 테마가 하나도 없었다'로 읽는데, 그것은
          # 시트를 못 읽은 것과 전혀 다른 말이다.
          python feed_export.py themes --feed-dir /tmp/theme_bot/feed
          cd /tmp/theme_bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feed
          git diff --cached --quiet && echo "피드에 바뀐 것이 없습니다" && exit 0
          git commit -m "theme feed $(TZ=Asia/Seoul date -d "${THEME_AS_OF:-today}" +%Y%m%d) (republish)"
          git push origin HEAD:main
