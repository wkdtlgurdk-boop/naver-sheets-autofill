name: theme-stats

# 테마 지속성 통계와 오배정 기록. 금요일 밤, 그 주 테마 달력이 다 찬 뒤에 돈다.
#
# 22:40 KST (13:40 UTC). theme-calendar 의 마지막 회차가 22:10 이고 보통 5~13분
# 늦게 끝나므로 그 뒤에 둔다. 정각을 피하는 이유는 theme-calendar.yml 주석과 같다.
#
# 두 가지를 남긴다.
#   report.md / latest.json   사람이 읽는 통계. 요약 화면과 theme_bot feed/stats/
#   affinity.json             종목별 과거 키워드 기록. 이 저장소에 커밋해서
#                             theme_scan 의 오배정 판정(theme_fit)이 다음 실행부터 쓴다.

on:
  schedule:
    - cron: "40 13 * * 5"
  workflow_dispatch:
    inputs:
      days:
        description: "최근 N일만 (0 = 시트 전체)"
        type: string
        default: "0"
      dry_run:
        description: "계산만 하고 theme_bot 에 올리지 않음"
        type: boolean
        default: false
      dump_only:
        description: "시트 전체를 analysis/sheet_days.json 으로 덤프해 이 브랜치에 커밋만 한다 (통계·업로드 생략)"
        type: boolean
        default: false

concurrency:
  group: theme-stats
  cancel-in-progress: false

# affinity.json 을 되돌려 놓는다.
permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run logic tests
        run: python test_theme_stats.py && python test_theme_fit.py

      # 테마 편입 후 N거래일 성적 분석(analysis/theme_horizon.py)이 읽을 원본.
      - name: 시트 덤프
        if: ${{ inputs.dump_only == true }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p analysis
          python - <<'PY'
          import json
          from theme_stats import DAILY_ID, read_sheet
          from sheets import Spreadsheet
          days = read_sheet(Spreadsheet(DAILY_ID))
          out = {d.isoformat(): g for d, g in sorted(days.items())}
          json.dump(out, open("analysis/sheet_days.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=0)
          print(len(out), "days", min(out), "~", max(out))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/sheet_days.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Dump Daily sheet for theme horizon analysis"
          git push origin HEAD:${{ github.ref_name }}

      - name: 통계 계산
        if: ${{ inputs.dump_only != true }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python theme_stats.py --out stats_out --days "${{ inputs.days || '0' }}" --affinity affinity.json
          cat stats_out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 오배정 기록을 커밋한다
        if: ${{ inputs.dry_run != true && inputs.dump_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affinity.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Refresh theme affinity ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git pull --rebase --autostash origin master
          git push origin HEAD:master

      - name: theme_bot 에 올린다
        if: ${{ inputs.dry_run != true && inputs.dump_only != true }}
        env:
          CARD_REPO_TOKEN: ${{ secrets.CARD_REPO_TOKEN || secrets.CARDREPOTOKEN }}
        run: |
          if [ -z "$CARD_REPO_TOKEN" ]; then
            echo "CARD_REPO_TOKEN 이 없어 올리지 않습니다 — 결과는 아티팩트에 있습니다."
            exit 0
          fi
          day=$(TZ=Asia/Seoul date +%Y%m%d)
          git clone --depth 1 \
            "https://x-access-token:${CARD_REPO_TOKEN}@github.com/wkdtlgurdk-boop/theme_bot.git" /tmp/theme_bot
          mkdir -p /tmp/theme_bot/feed/stats
          cp stats_out/latest.json "/tmp/theme_bot/feed/stats/latest.json"
          cp stats_out/latest.json "/tmp/theme_bot/feed/stats/$day.json"
          cp stats_out/report.md "/tmp/theme_bot/feed/stats/report.md"
          cd /tmp/theme_bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/stats
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "stats $day"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-stats-${{ github.run_id }}
          path: stats_out/
          retention-days: 30
